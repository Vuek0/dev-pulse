databaseChangeLog:
  - changeSet: 
      id: 001-create-monitors
      author: Muhammad
      changes:
        - createTable:
            tableName: monitors
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: interval_seconds
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE monitors ADD CONSTRAINT chk_monitors_interval CHECK (interval_seconds >= 10)